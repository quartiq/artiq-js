name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JS/TS build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            sipyco-js/package-lock.json
            artiq-js/package-lock.json
            artiq-web/package-lock.json
            artiq-vscode/package-lock.json

      - name: Install sipyco-js
        run: npm ci --prefix sipyco-js

      - name: Build sipyco-js
        run: npm run build --prefix sipyco-js

      - name: Test sipyco-js
        run: npm test --prefix sipyco-js -- --run

      - name: Install artiq-js
        run: npm ci --prefix artiq-js

      - name: Build artiq-js
        run: npm run build --prefix artiq-js

      - name: Install artiq-web and artiq-vscode
        run: |
          npm ci --prefix artiq-web
          npm ci --prefix artiq-vscode

      - name: Check formatting
        run: |
          npm run format:check --prefix sipyco-js
          npm run format:check --prefix artiq-js
          npm run format:check --prefix artiq-web
          npm run format:check --prefix artiq-vscode

      - name: Build artiq-web and check types
        run: npm run build --prefix artiq-web

      - name: Build artiq-vscode and check types
        run: npm run package --prefix artiq-vscode

      - name: Test artiq-vscode
        run: |
          npm run build:tests --prefix artiq-vscode
          xvfb-run -a npm test --prefix artiq-vscode

      - name: Lint
        run: |
          npm run lint --prefix sipyco-js
          npm run lint --prefix artiq-js
          npm run lint --prefix artiq-web
          npm run lint --prefix artiq-vscode

  go:
    name: Go format, lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: artiq-web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: artiq-web/go.mod
          cache-dependency-path: artiq-web/go.sum

      - name: Check formatting
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout=2m ./...

      - name: Build
        run: go build ./...

  smoke:
    name: ARTIQ integration smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nixbld.m-labs.hk
            extra-trusted-public-keys = nixbld.m-labs.hk-1:5aSRVA5b320xbNvu30tqxVPXpld73bhtOeH6uAjRyHc=

      - name: Test dataset create, update and delete
        run: bash artiq-vscode/test/smoke.sh
